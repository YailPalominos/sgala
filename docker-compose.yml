# Orquestación completa de SGALA:
# frontend (Angular + Nginx), backend (Node + Prisma), agente (Python),
# SQL Server y Redis en un único docker compose.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sgala-sqlserver
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      TZ: "America/Mexico_City"
    ports:
      - "1433:1433"
    volumes:
      - sql_datos:/var/opt/mssql
      - ./init.sql:/usr/src/init.sql
      - ./entrypoint.sh:/usr/src/entrypoint.sh
    command: ["/bin/bash", "/usr/src/entrypoint.sh"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /var/opt/mssql/.init-ejecutado &&
          { if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
          SQLCMD=/opt/mssql-tools18/bin/sqlcmd; OPCIONES_TLS="-C";
          else SQLCMD=/opt/mssql-tools/bin/sqlcmd; OPCIONES_TLS=""; fi;
          $$SQLCMD -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          $$OPCIONES_TLS -b -Q "SELECT 1" >/dev/null 2>&1; }
      interval: 5s
      timeout: 5s
      retries: 72
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sgala-redis
    environment:
      TZ: "America/Mexico_City"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - redis_datos:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: sgala-backend
    env_file:
      - ./backend/.env
    environment:
      TZ: "America/Mexico_City"
      SQL_SERVIDOR: "sqlserver"
      REDIS_SERVIDOR: "redis"
      SQL_CONTRASENA: ${MSSQL_SA_PASSWORD}
      REDIS_CONTRASENA: ${REDIS_PASSWORD}
      DATABASE_URL: "sqlserver://sqlserver:1433;database=sgala;user=sa;password=${MSSQL_SA_PASSWORD};encrypt=true;trustServerCertificate=true"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4059:4059"   # API
      - "4060:4060"   # Broker MQTT
      - "4061:4061"   # Socket.io
    restart: unless-stopped

  agente:
    build:
      context: ./agente
    container_name: sgala-agente
    environment:
      TZ: "America/Mexico_City"
    ports:
      - "4700:4700"   # Socket del agente
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: sgala-frontend
    environment:
      TZ: "America/Mexico_City"
    ports:
      - "80:80"       # Producción: Nginx sirve la app
    depends_on:
      - backend
      - agente
    restart: unless-stopped

volumes:
  sql_datos:
  redis_datos:
