<h2 mat-dialog-title class="centrado">
    {{ parametros.titulo || 'Confirmar' }}
</h2>

<mat-dialog-content class="centrado">
    {{ parametros.mensaje || '¿Está seguro de realizar esta acción?' }}
</mat-dialog-content>

<mat-dialog-actions align="center">

<button mat-raised-button (click)="responder(false)">
    <mat-icon>close</mat-icon>
    {{ parametros.textoNo || 'No' }}
</button>

<button mat-raised-button color="primary" (click)="responder(true)">
    <mat-icon>check</mat-icon>
    {{ parametros.textoSi || 'Sí' }}
</button>
</mat-dialog-actions>
