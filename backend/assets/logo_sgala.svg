<svg width="350" height="350" viewBox="0 0 350 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Alas: gris claro en las puntas, negro al centro -->
    <linearGradient id="gradAlas" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="35%" stop-color="#2a2a2a"/>
      <stop offset="65%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#8a979e"/>
    </linearGradient>
    <!-- Círculo: gris oscuro con brillo -->
    <radialGradient id="gradCirculo" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0%" stop-color="#9aa7ae"/>
      <stop offset="55%" stop-color="#55646c"/>
      <stop offset="100%" stop-color="#273036"/>
    </radialGradient>
  </defs>

  <!-- Círculo superior (sol / esfera) -->
